<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Travel Planner Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#202124;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.shell{max-width:860px;margin:auto;padding:16px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.top h1{font-size:22px;margin:0}.tabs{display:flex;gap:4px;overflow:auto;background:#e9eaed;border-radius:11px;padding:3px;margin-bottom:14px}.tab{flex:1;min-width:74px;border:0;background:transparent;padding:9px 10px;border-radius:8px;font-weight:700;white-space:nowrap}.tab.active{background:white}.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#202124;color:white}.secondary{background:white;border:1px solid #dadce0}.danger{background:#fff1f0;color:#b3261e;border:1px solid #f2b8b5}.card{background:white;border:1px solid #e3e3e3;border-radius:14px;padding:14px;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar select{padding:10px;border:1px solid #c9c9c9;border-radius:9px;background:white;min-width:150px}.item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{margin:0 0 4px;font-size:16px}.meta{font-size:13px;color:#666}.actions{display:flex;gap:6px}.actions .btn{padding:8px 10px;font-size:13px}.empty,.status{color:#666;text-align:center;padding:20px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:5}.overlay.open{display:flex}.sheet{background:white;width:100%;max-width:860px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}.sheet h2{margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:2px}.field.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #c9c9c9;border-radius:9px;font:inherit;background:white}.sheet-actions{display:flex;gap:8px;position:sticky;bottom:0;background:white;padding-top:14px}.sheet-actions .btn{flex:1}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#202124;color:white;padding:10px 14px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.item{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.toolbar select{flex:1;min-width:0}}
</style></head><body>
<div class="shell"><div class="top"><div><div class="meta">Planner 管理端 · P6</div><h1 id="pageTitle">行程管理</h1></div><button class="btn primary" id="addBtn">＋ 新增</button></div><div class="tabs" id="tabs"></div><div class="toolbar" id="filters"></div><div id="list"><div class="status">載入中…</div></div></div>
<div class="overlay" id="overlay"><form class="sheet" id="form"><h2 id="formTitle"></h2><div id="formFields"></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelBtn">取消</button><button type="submit" class="btn primary" id="saveBtn">儲存</button></div></form></div><div class="toast" id="toast"></div>
<script>
const MODES=['itinerary','reservations','hotels','flights','transport'];
const titles={itinerary:'行程',reservations:'預訂',hotels:'住宿',flights:'航班',transport:'交通'};
const state={mode:'itinerary',itinerary:[],reservations:[],hotels:[],flights:[],transport:[],places:[],members:[],filters:{date:'',group:'all',status:'all'}};
const labels={ours:'我們',friends:'朋友',all:'全部',confirmed:'已確認',tentative:'暫定',optional:'可選',not_required:'不需預訂',planned:'規劃中',need_booking:'待預訂',booked:'已預訂',paid:'已付款',cancelled:'已取消',hotel:'住宿',flight:'航班',train:'火車',bus:'巴士',ferry:'渡輪',restaurant:'餐廳',activity:'活動',ticket:'票券',rental_car:'租車',airport_transfer:'機場接送',other:'其他'};
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e?.message||String(e))))[name](...args))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function options(values,blank){const a=blank?[['',blank],...values]:values;return a.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}
function placeOptions(blank='— 未指定 —'){return options(state.places.map(p=>[p.id,`${p.city||''} · ${p.name||p.id}`]),blank)}
function reservationOptions(blank='— 未連結 —'){return options(state.reservations.map(r=>[r.id,`${labels[r.category]||r.category} · ${r.name}`]),blank)}
function transportOptions(blank='— 未連結 —'){return options(state.transport.map(t=>[t.id,`${labels[t.type]||t.type} · ${placeName(t.from_place_id)} → ${placeName(t.to_place_id)}`]),blank)}
function placeName(id){return state.places.find(p=>p.id===id)?.name||id||'—'} function memberName(id){return state.members.find(m=>m.id===id)?.name||id||'未指定'}
async function load(){ $('list').innerHTML='<div class="status">載入中…</div>'; try{const d=await call('getAdminBootstrap');MODES.forEach(m=>state[m]=d[m]||[]);state.places=d.places||[];state.members=d.members||[];render()}catch(e){$('list').innerHTML=`<div class="card">載入失敗：${esc(e.message)}</div>`}}
function buildTabs(){ $('tabs').innerHTML=MODES.map(m=>`<button class="tab ${m===state.mode?'active':''}" data-mode="${m}">${titles[m]}</button>`).join(''); document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{state.mode=t.dataset.mode;state.filters.date='';state.filters.status='all';$('pageTitle').textContent=titles[state.mode]+'管理';render()}) }
function render(){buildTabs();renderFilters();renderList()} function hasDate(){return ['itinerary','reservations','flights','transport'].includes(state.mode)}
function renderFilters(){const rows=state[state.mode]||[], dates=[...new Set(rows.map(x=>x.date).filter(Boolean))].sort();let h='';if(hasDate())h+=`<select id="dateFilter"><option value="">全部日期</option>${dates.map(d=>`<option value="${d}">${d}</option>`).join('')}</select>`;h+=`<select id="groupFilter"><option value="all">全部群組</option><option value="ours">我們</option><option value="friends">朋友</option><option value="common">共同</option></select>`;if(state.mode==='reservations')h+=`<select id="statusFilter"><option value="all">全部狀態</option>${['need_booking','planned','booked','paid','not_required','cancelled'].map(v=>`<option value="${v}">${labels[v]}</option>`).join('')}</select>`;h+='<button class="btn secondary" id="reloadBtn">重新整理</button>';$('filters').innerHTML=h;if($('dateFilter')){$('dateFilter').value=state.filters.date;$('dateFilter').onchange=e=>{state.filters.date=e.target.value;renderList()}}$('groupFilter').value=state.filters.group;$('groupFilter').onchange=e=>{state.filters.group=e.target.value;renderList()};if($('statusFilter')){$('statusFilter').value=state.filters.status;$('statusFilter').onchange=e=>{state.filters.status=e.target.value;renderList()}}$('reloadBtn').onclick=load}
function groupMatch(x){const g=state.filters.group;return g==='all'||(g==='common'?x.group==='all':x.group===g)}
function filteredRows(){let a=[...(state[state.mode]||[])].filter(groupMatch);if(state.filters.date&&hasDate())a=a.filter(x=>x.date===state.filters.date);if(state.mode==='reservations'&&state.filters.status!=='all')a=a.filter(x=>x.status===state.filters.status);return a.sort((a,b)=>String(a.date||a.check_in||'9999').localeCompare(String(b.date||b.check_in||'9999'))||String(a.start_time||a.time||a.departure_time||'').localeCompare(String(b.start_time||b.time||b.departure_time||''))||Number(a.order||0)-Number(b.order||0))}
function summary(x){switch(state.mode){case'itinerary':return [`${x.start_time||'—'} · ${x.title}`,`${x.date} · ${labels[x.group]||x.group} · ${x.city||''}`,`${labels[x.certainty]||x.certainty} · order ${x.order||''}`];case'reservations':return [`${labels[x.category]||x.category} · ${x.name}`,`${x.date||'未指定日期'} ${x.time||''} · ${labels[x.group]||x.group}`,`${labels[x.status]||x.status} · 負責：${memberName(x.owner_member_id)}`];case'hotels':return [x.hotel_name,`${x.city} · ${x.check_in} → ${x.check_out}`,`${labels[x.group]||x.group}${x.reservation_id?' · '+x.reservation_id:''}`];case'flights':return [`${x.airline} ${x.flight_no}`,`${x.date} · ${x.departure_airport} → ${x.arrival_airport}`,`${x.departure_time||'—'} → ${x.arrival_time||'—'} · ${labels[x.group]||x.group}`];case'transport':return [`${labels[x.type]||x.type} · ${placeName(x.from_place_id)} → ${placeName(x.to_place_id)}`,`${x.date} ${x.departure_time||''} · ${labels[x.group]||x.group}`,`${x.operator||''} ${x.service_no||''}${x.reservation_id?' · '+x.reservation_id:''}`]}}
function renderList(){const a=filteredRows();$('list').innerHTML=a.length?a.map(x=>{const s=summary(x);return `<div class="card item"><div><h3>${esc(s[0])}</h3><div class="meta">${esc(s[1])}</div><div class="meta">${esc(s[2])}</div></div><div class="actions"><button class="btn secondary" data-edit="${x.id}">編輯</button><button class="btn danger" data-delete="${x.id}">刪除</button></div></div>`}).join(''):`<div class="card empty">目前沒有符合條件的${titles[state.mode]}資料。</div>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(a.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeItem(b.dataset.delete))}
function input(id,label,type='text',value='',extra='',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><input id="f_${id}" type="${type}" value="${esc(value)}" ${extra}></div>`} function sel(id,label,html,value='',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><select id="f_${id}">${html}</select></div>`} function area(id,label,value=''){return `<div class="field full"><label>${label}</label><textarea id="f_${id}" rows="3">${esc(value)}</textarea></div>`} function pick(id,value){const el=$('f_'+id);if(el)el.value=value??''} function commonGroup(value='all'){return sel('group','群組 *',options([['ours','我們'],['friends','朋友'],['all','全部']]),value)}
function formHtml(x){
 if(state.mode==='itinerary')return `<div class="grid">${input('date','日期 *','date',x.date||state.filters.date||'2026-12-21','required')}${commonGroup(x.group||'all')}${input('start_time','開始時間','time',x.start_time||'')}${input('end_time','結束時間','time',x.end_time||'')}${input('title','標題 *','text',x.title||'','required maxlength="120"',true)}${input('city','城市','text',x.city||'')}${sel('certainty','確定程度 *',options([['confirmed','已確認'],['tentative','暫定'],['optional','可選']]),x.certainty||'confirmed')}${sel('place_id','地點',placeOptions(),x.place_id||'')}${sel('transport_id','交通關聯',transportOptions(),x.transport_id||'')}${sel('reservation_id','預訂關聯',reservationOptions(),x.reservation_id||'')}${input('order','排序 *','number',x.order||10,'min="0" required')}${area('description','說明',x.description||'')}${area('notes','私人備註',x.notes||'')}</div>`;
 if(state.mode==='reservations')return `<div class="grid">${sel('category','類別 *',options(['hotel','flight','train','restaurant','activity','ticket','rental_car','other'].map(v=>[v,labels[v]])),x.category||'other')}${input('name','名稱 *','text',x.name||'','required maxlength="160"')}${input('date','日期','date',x.date||state.filters.date||'')}${input('time','時間','time',x.time||'')}${commonGroup(x.group||'all')}${sel('status','狀態 *',options(['not_required','planned','need_booking','booked','paid','cancelled'].map(v=>[v,labels[v]])),x.status||'planned')}${sel('owner_member_id','負責人',options(state.members.filter(m=>String(m.active).toUpperCase()!=='FALSE').map(m=>[m.id,`${m.name} (${labels[m.group]||m.group})`]),'— 未指定 —'),x.owner_member_id||'')}${input('deadline','預訂期限','date',x.deadline||'')}${input('price','價格','number',x.price||'','min="0" step="0.01"')}${input('currency','幣別','text',x.currency||'JPY','maxlength="8"')}${input('booking_url','預訂網址','url',x.booking_url||'','placeholder="https://…"',true)}${input('confirmation_no','確認編號','text',x.confirmation_no||'','maxlength="120"',true)}${area('notes','私人備註',x.notes||'')}</div>`;
 if(state.mode==='hotels')return `<div class="grid">${input('city','城市 *','text',x.city||'','required')}${input('hotel_name','住宿名稱 *','text',x.hotel_name||'','required maxlength="160"')}${input('check_in','入住日期 *','date',x.check_in||'','required')}${input('check_out','退房日期 *','date',x.check_out||'','required')}${commonGroup(x.group||'all')}${sel('place_id','Place',placeOptions(),x.place_id||'')}${input('address','地址','text',x.address||'','',true)}${input('google_maps_url','Google Maps','url',x.google_maps_url||'','placeholder="https://…"',true)}${sel('reservation_id','預訂關聯',reservationOptions(),x.reservation_id||'')}${input('booking_url','預訂網址（私人）','url',x.booking_url||'','placeholder="https://…"',true)}${input('confirmation_no','確認編號（私人）','text',x.confirmation_no||'','maxlength="120"',true)}${area('notes','私人備註',x.notes||'')}</div>`;
 if(state.mode==='flights')return `<div class="grid">${input('date','日期 *','date',x.date||state.filters.date||'','required')}${commonGroup(x.group||'all')}${input('airline','航空公司 *','text',x.airline||'','required')}${input('flight_no','航班號 *','text',x.flight_no||'','required')}${input('departure_airport','出發機場 *','text',x.departure_airport||'','required')}${input('arrival_airport','抵達機場 *','text',x.arrival_airport||'','required')}${input('departure_time','起飛時間','time',x.departure_time||'')}${input('arrival_time','抵達時間','time',x.arrival_time||'')}${sel('reservation_id','預訂關聯',reservationOptions(),x.reservation_id||'')}${input('booking_reference','訂位代號（私人）','text',x.booking_reference||'','maxlength="120"',true)}${area('notes','私人備註',x.notes||'')}</div>`;
 return `<div class="grid">${input('date','日期 *','date',x.date||state.filters.date||'','required')}${sel('type','類型 *',options(['train','bus','ferry','rental_car','airport_transfer','other'].map(v=>[v,labels[v]])),x.type||'train')}${sel('from_place_id','出發地 *',placeOptions('— 請選擇 —'),x.from_place_id||'')}${sel('to_place_id','目的地 *',placeOptions('— 請選擇 —'),x.to_place_id||'')}${input('departure_time','出發時間','time',x.departure_time||'')}${input('arrival_time','抵達時間','time',x.arrival_time||'')}${input('operator','營運商','text',x.operator||'')}${input('service_no','班次／車次','text',x.service_no||'')}${commonGroup(x.group||'all')}${sel('reservation_required','需要預訂',options([['false','否'],['true','是']]),String(x.reservation_required).toLowerCase()==='true'?'true':'false')}${sel('reservation_id','預訂關聯',reservationOptions(),x.reservation_id||'')}${input('url','相關網址（私人）','url',x.url||'','placeholder="https://…"',true)}${area('notes','私人備註',x.notes||'')}</div>`;
}
function openForm(item){$('form').dataset.id=item?.id||'';$('formTitle').textContent=(item?'編輯':'新增')+titles[state.mode];$('formFields').innerHTML=formHtml(item||{});const x=item||{};['group','certainty','place_id','transport_id','reservation_id','category','status','owner_member_id','type','from_place_id','to_place_id','reservation_required'].forEach(k=>pick(k,x[k]??$('f_'+k)?.value));$('overlay').classList.add('open')} function closeForm(){$('overlay').classList.remove('open')} function collect(){const d={id:$('form').dataset.id||''};$('formFields').querySelectorAll('[id^="f_"]').forEach(el=>d[el.id.slice(2)]=el.value);if('order'in d)d.order=Number(d.order);return d}
const saveFns={itinerary:'saveItinerary',reservations:'saveReservation',hotels:'saveHotel',flights:'saveFlight',transport:'saveTransport'}, deleteFns={itinerary:'deleteItinerary',reservations:'deleteReservation',hotels:'deleteHotel',flights:'deleteFlight',transport:'deleteTransport'};
async function submitForm(e){e.preventDefault();$('saveBtn').disabled=true;try{const r=await call(saveFns[state.mode],collect());closeForm();toast(r.action==='created'?'已新增':'已更新');await load()}catch(err){alert('儲存失敗：'+err.message)}finally{$('saveBtn').disabled=false}} async function removeItem(id){const x=(state[state.mode]||[]).find(r=>r.id===id),s=summary(x);if(!confirm(`確定刪除「${s[0]}」？\n\n若仍被其他資料引用，系統會阻止刪除。`))return;try{await call(deleteFns[state.mode],id);toast('已刪除');await load()}catch(err){alert('刪除失敗：'+err.message)}}
$('addBtn').onclick=()=>openForm(null);$('cancelBtn').onclick=closeForm;$('form').onsubmit=submitForm;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeForm()};load();
</script></body></html>
