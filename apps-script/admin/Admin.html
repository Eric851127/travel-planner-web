n').onclick=load}function smartDate(){var dates=[];state.itinerary.forEach(function(x){if(x.date&&dates.indexOf(x.date)<0)dates.push(x.date)});dates.sort();if(!dates.length)return'';var now=new Date(),today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');if(today<dates[0])return dates[0];if(today>dates[dates.length-1])return dates[dates.length-1];if(dates.indexOf(today)>=0)return today;for(var i=0;i<dates.length;i++)if(dates[i]>=today)return dates[i];return dates[dates.length-1]}async function load(){$('list').innerHTML='<div class="status">正在讀取 Google Sheet…</div>';try{var d=await runServer('getAdminBootstrap',[],15000);MODES.forEach(function(m){state[m]=Array.isArray(d[m])?d[m]:[]});state.places=Array.isArray(d.places)?d.places:[];state.members=Array.isArray(d.members)?d.members:[];state.currentAdmin=d.current_admin||null;if(!state.date)state.date=smartDate();$('adminIdentity').textContent=state.currentAdmin?'目前登入：'+(state.currentAdmin.name||state.currentAdmin.email):'';render()}catch(e){showError(e)}}function buildTabs(){$('tabs').innerHTML=MODES.map(function(m){return'<button class="tab '+(m===state.mode?'active':'')+'" data-mode="'+m+'">'+TITLES[m]+'</button>'}).join('');document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){state.mode=t.dataset.mode;state.status='all';$('pageTitle').textContent=TITLES[state.mode]+'管理';render()}})}function hasDate(){return['itinerary','reservations','flights','transport'].indexOf(state.mode)>=0}function groupMatch(x){if(state.mode==='places'||state.group==='all')return true;if(state.group==='common')return x.group==='all';return x.group===state.group}function filtered(){var rows=(state[state.mode]||[]).filter(groupMatch);if(state.date&&hasDate())rows=rows.filter(function(x){return x.date===state.date});if(state.mode==='reservations'&&state.status!=='all')rows=rows.filter(function(x){return x.status===state.status});return rows.sort(function(a,b){return String(a.date||a.check_in||'9999').localeCompare(String(b.date||b.check_in||'9999'))||String(a.start_time||a.time||a.departure_time||'').localeCompare(String(b.start_time||b.time||b.departure_time||''))||Number(a.order||0)-Number(b.order||0)})}function renderFilters(){var rows=state[state.mode]||[],dates=[];rows.forEach(function(x){if(x.date&&dates.indexOf(x.date)<0)dates.push(x.date)});dates.sort();var html='';if(hasDate())html+='<select id="dateFilter"><option value="">全部日期</option>'+dates.map(function(d){return'<option value="'+esc(d)+'">'+esc(d)+'</option>'}).join('')+'</select>';if(state.mode!=='places')html+='<select id="groupFilter"><option value="all">全部群組</option><option value="ours">郭小鼠組</option><option value="friends">阿香組</option><option value="common">共同</option></select>';if(state.mode==='reservations')html+='<select id="statusFilter"><option value="all">全部狀態</option>'+['need_booking','planned','booked','paid','not_required','cancelled'].map(function(v){return'<option value="'+v+'">'+labels[v]+'</option>'}).join('')+'</select>';html+='<button class="btn secondary" id="reloadBtn">重新整理</button>';$('filters').innerHTML=html;if($('dateFilter')){$('dateFilter').value=state.date;$('dateFilter').onchange=function(e){state.date=e.target.value;renderList();renderQuality()}}if($('groupFilter')){$('groupFilter').value=state.group;$('groupFilter').onchange=function(e){state.group=e.target.value;renderList();renderQuality()}}if($('statusFilter')){$('statusFilter').value=state.status;$('statusFilter').onchange=function(e){state.status=e.target.value;renderList();renderQuality()}}$('reloadBtn').onclick=load}function placeName(id){var p=state.places.find(function(x){return x.id===id});return p?p.name:(id||'—')}function memberName(id){var m=state.members.find(function(x){return x.id===id});return m?m.name:(id||'未指定')}function qualityWarnings(mode,x){var w=[];function hr(id){return!id||state.reservations.some(function(r){return r.id===id})}function hp(id){return!id||sta
