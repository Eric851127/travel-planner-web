<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Travel Planner Admin</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#202124;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.shell{max-width:860px;margin:auto;padding:16px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.top h1{font-size:22px;margin:0}.tabs{display:flex;gap:4px;overflow:auto;background:#e9eaed;border-radius:11px;padding:3px;margin-bottom:14px}.tab{flex:1;min-width:74px;border:0;background:transparent;padding:9px 10px;border-radius:8px;font-weight:700;white-space:nowrap}.tab.active{background:white}.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#202124;color:white}.secondary{background:white;border:1px solid #dadce0}.danger{background:#fff1f0;color:#b3261e;border:1px solid #f2b8b5}.card{background:white;border:1px solid #e3e3e3;border-radius:14px;padding:14px;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar select{padding:10px;border:1px solid #c9c9c9;border-radius:9px;background:white;min-width:150px}.item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{margin:0 0 4px;font-size:16px}.meta{font-size:13px;color:#666}.actions{display:flex;gap:6px}.actions .btn{padding:8px 10px;font-size:13px}.empty,.status{color:#666;text-align:center;padding:20px}.error{border-color:#f2b8b5;background:#fff8f7}.error strong{display:block;color:#b3261e;margin-bottom:6px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:5}.overlay.open{display:flex}.sheet{background:white;width:100%;max-width:860px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #c9c9c9;border-radius:9px;font:inherit;background:white}.sheet-actions{display:flex;gap:8px;position:sticky;bottom:0;background:white;padding-top:14px}.sheet-actions .btn{flex:1}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#202124;color:white;padding:10px 14px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.item{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.toolbar select{flex:1;min-width:0}}
  </style>
</head>
<body>
<div class="shell">
  <div class="top"><div><div class="meta">Planner 管理端 · P6</div><h1 id="pageTitle">行程管理</h1></div><button class="btn primary" id="addBtn">＋ 新增</button></div>
  <div class="tabs" id="tabs"></div><div class="toolbar" id="filters"></div><div id="list"><div class="status">載入中…</div></div>
</div>
<div class="overlay" id="overlay"><form class="sheet" id="form"><h2 id="formTitle"></h2><div id="formFields"></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelBtn">取消</button><button type="submit" class="btn primary" id="saveBtn">儲存</button></div></form></div>
<div class="toast" id="toast"></div>
<script>
var MODES=['itinerary','reservations','hotels','flights','transport'];
var TITLES={itinerary:'行程',reservations:'預訂',hotels:'住宿',flights:'航班',transport:'交通'};
var state={mode:'itinerary',itinerary:[],reservations:[],hotels:[],flights:[],transport:[],places:[],members:[],date:'',group:'all',status:'all'};
var labels={ours:'我們',friends:'朋友',all:'全部',confirmed:'已確認',tentative:'暫定',optional:'可選',not_required:'不需預訂',planned:'規劃中',need_booking:'待預訂',booked:'已預訂',paid:'已付款',cancelled:'已取消',hotel:'住宿',flight:'航班',train:'火車',bus:'巴士',ferry:'渡輪',restaurant:'餐廳',activity:'活動',ticket:'票券',rental_car:'租車',airport_transfer:'機場接送',other:'其他'};
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function runServer(name,args,timeoutMs){return new Promise(function(resolve,reject){var done=false;var timer=setTimeout(function(){if(!done){done=true;reject(new Error('Apps Script 回應逾時（'+Math.round(timeoutMs/1000)+' 秒）'))}},timeoutMs);var runner=google.script.run.withSuccessHandler(function(v){if(done)return;done=true;clearTimeout(timer);resolve(v)}).withFailureHandler(function(e){if(done)return;done=true;clearTimeout(timer);reject(new Error(e&&e.message?e.message:String(e)))});try{runner[name].apply(runner,args||[])}catch(e){if(!done){done=true;clearTimeout(timer);reject(e)}}})}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},2200)}
function showError(e){$('list').innerHTML='<div class="card error"><strong>管理頁載入失敗</strong><div>'+esc(e.message||e)+'</div><button class="btn secondary" id="retryBtn" style="margin-top:12px">重新嘗試</button></div>';$('retryBtn').onclick=load}
async function load(){
  $('list').innerHTML='<div class="status">正在讀取 Google Sheet…</div>';
  try{
    var d=await runServer('getAdminBootstrap',[],15000);
    if(!d)throw new Error('getAdminBootstrap 沒有回傳資料');
    MODES.forEach(function(m){state[m]=Array.isArray(d[m])?d[m]:[]});
    state.places=Array.isArray(d.places)?d.places:[];state.members=Array.isArray(d.members)?d.members:[];
    render();
  }catch(e){showError(e)}
}
function buildTabs(){$('tabs').innerHTML=MODES.map(function(m){return '<button class="tab '+(m===state.mode?'active':'')+'" data-mode="'+m+'">'+TITLES[m]+'</button>'}).join('');document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){state.mode=t.dataset.mode;state.date='';state.status='all';$('pageTitle').textContent=TITLES[state.mode]+'管理';render()}})}
function hasDate(){return ['itinerary','reservations','flights','transport'].indexOf(state.mode)>=0}
function groupMatch(x){return state.group==='all'||(state.group==='common'?x.group==='all':x.group===state.group)}
function filtered(){var a=(state[state.mode]||[]).filter(groupMatch);if(state.date&&hasDate())a=a.filter(function(x){return x.date===state.date});if(state.mode==='reservations'&&state.status!=='all')a=a.filter(function(x){return x.status===state.status});return a.sort(function(a,b){return String(a.date||a.check_in||'9999').localeCompare(String(b.date||b.check_in||'9999'))||String(a.start_time||a.time||a.departure_time||'').localeCompare(String(b.start_time||b.time||b.departure_time||''))||Number(a.order||0)-Number(b.order||0)})}
function renderFilters(){var rows=state[state.mode]||[];var dates=[];rows.forEach(function(x){if(x.date&&dates.indexOf(x.date)<0)dates.push(x.date)});dates.sort();var h='';if(hasDate())h+='<select id="dateFilter"><option value="">全部日期</option>'+dates.map(function(d){return '<option value="'+esc(d)+'">'+esc(d)+'</option>'}).join('')+'</select>';h+='<select id="groupFilter"><option value="all">全部群組</option><option value="ours">我們</option><option value="friends">朋友</option><option value="common">共同</option></select>';if(state.mode==='reservations')h+='<select id="statusFilter"><option value="all">全部狀態</option>'+['need_booking','planned','booked','paid','not_required','cancelled'].map(function(v){return '<option value="'+v+'">'+labels[v]+'</option>'}).join('')+'</select>';h+='<button class="btn secondary" id="reloadBtn">重新整理</button>';$('filters').innerHTML=h;if($('dateFilter')){$('dateFilter').value=state.date;$('dateFilter').onchange=function(e){state.date=e.target.value;renderList()}}$('groupFilter').value=state.group;$('groupFilter').onchange=function(e){state.group=e.target.value;renderList()};if($('statusFilter')){$('statusFilter').value=state.status;$('statusFilter').onchange=function(e){state.status=e.target.value;renderList()}}$('reloadBtn').onclick=load}
function placeName(id){var p=state.places.find(function(x){return x.id===id});return p?p.name:(id||'—')}function memberName(id){var m=state.members.find(function(x){return x.id===id});return m?m.name:(id||'未指定')}
function summary(x){if(state.mode==='itinerary')return[(x.start_time||'—')+' · '+x.title,x.date+' · '+(labels[x.group]||x.group)+' · '+(x.city||''),(labels[x.certainty]||x.certainty)+' · order '+(x.order||'')];if(state.mode==='reservations')return[(labels[x.category]||x.category)+' · '+x.name,(x.date||'未指定日期')+' '+(x.time||'')+' · '+(labels[x.group]||x.group),(labels[x.status]||x.status)+' · 負責：'+memberName(x.owner_member_id)];if(state.mode==='hotels')return[x.hotel_name,x.city+' · '+x.check_in+' → '+x.check_out,(labels[x.group]||x.group)+(x.reservation_id?' · '+x.reservation_id:'')];if(state.mode==='flights')return[(x.airline||'')+' '+(x.flight_no||''),x.date+' · '+x.departure_airport+' → '+x.arrival_airport,(x.departure_time||'—')+' → '+(x.arrival_time||'—')+' · '+(labels[x.group]||x.group)];return[(labels[x.type]||x.type)+' · '+placeName(x.from_place_id)+' → '+placeName(x.to_place_id),x.date+' '+(x.departure_time||'')+' · '+(labels[x.group]||x.group),(x.operator||'')+' '+(x.service_no||'')+(x.reservation_id?' · '+x.reservation_id:'')]}
function renderList(){var a=filtered();$('list').innerHTML=a.length?a.map(function(x){var s=summary(x);return '<div class="card item"><div><h3>'+esc(s[0])+'</h3><div class="meta">'+esc(s[1])+'</div><div class="meta">'+esc(s[2])+'</div></div><div class="actions"><button class="btn secondary" data-edit="'+esc(x.id)+'">編輯</button><button class="btn danger" data-delete="'+esc(x.id)+'">刪除</button></div></div>'}).join(''):'<div class="card empty">目前沒有符合條件的'+TITLES[state.mode]+'資料。</div>';document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){openForm((state[state.mode]||[]).find(function(x){return x.id===b.dataset.edit}))}});document.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){removeItem(b.dataset.delete)}})}
function render(){buildTabs();renderFilters();renderList()}
function opts(a,blank){var x=blank?[['',blank]].concat(a):a;return x.map(function(i){return '<option value="'+esc(i[0])+'">'+esc(i[1])+'</option>'}).join('')}
function input(id,label,type,value,extra,full){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><input id="f_'+id+'" type="'+(type||'text')+'" value="'+esc(value||'')+'" '+(extra||'')+'></div>'}
function sel(id,label,html,full){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><select id="f_'+id+'">'+html+'</select></div>'}
function area(id,label,value){return '<div class="field full"><label>'+label+'</label><textarea id="f_'+id+'" rows="3">'+esc(value||'')+'</textarea></div>'}
function groupSel(){return sel('group','群組 *',opts([['ours','我們'],['friends','朋友'],['all','全部']]))}
function placeOpts(blank){return opts(state.places.map(function(p){return[p.id,(p.city||'')+' · '+(p.name||p.id)]}),blank||'— 未指定 —')}
function resOpts(){return opts(state.reservations.map(function(r){return[r.id,(labels[r.category]||r.category)+' · '+r.name]}),'— 未連結 —')}
function transOpts(){return opts(state.transport.map(function(t){return[t.id,(labels[t.type]||t.type)+' · '+placeName(t.from_place_id)+' → '+placeName(t.to_place_id)]}),'— 未連結 —')}
function formHtml(x){var h='<div class="grid">';if(state.mode==='itinerary'){h+=input('date','日期 *','date',x.date||state.date||'2026-12-21','required')+groupSel()+input('start_time','開始時間','time',x.start_time)+input('end_time','結束時間','time',x.end_time)+input('title','標題 *','text',x.title,'required maxlength="120"',true)+input('city','城市','text',x.city)+sel('certainty','確定程度 *',opts([['confirmed','已確認'],['tentative','暫定'],['optional','可選']]))+sel('place_id','地點',placeOpts())+sel('transport_id','交通關聯',transOpts())+sel('reservation_id','預訂關聯',resOpts())+input('order','排序 *','number',x.order||10,'min="0" required')+area('description','說明',x.description)+area('notes','私人備註',x.notes)}else if(state.mode==='reservations'){h+=sel('category','類別 *',opts(['hotel','flight','train','restaurant','activity','ticket','rental_car','other'].map(function(v){return[v,labels[v]]})))+input('name','名稱 *','text',x.name,'required maxlength="160"')+input('date','日期','date',x.date||state.date)+input('time','時間','time',x.time)+groupSel()+sel('status','狀態 *',opts(['not_required','planned','need_booking','booked','paid','cancelled'].map(function(v){return[v,labels[v]]})))+sel('owner_member_id','負責人',opts(state.members.map(function(m){return[m.id,m.name+' ('+(labels[m.group]||m.group)+')']}),'— 未指定 —'))+input('deadline','預訂期限','date',x.deadline)+input('price','價格','number',x.price,'min="0" step="0.01"')+input('currency','幣別','text',x.currency||'JPY')+input('booking_url','預訂網址','url',x.booking_url,'placeholder="https://…"',true)+input('confirmation_no','確認編號','text',x.confirmation_no,'',true)+area('notes','私人備註',x.notes)}else if(state.mode==='hotels'){h+=input('city','城市 *','text',x.city,'required')+input('hotel_name','住宿名稱 *','text',x.hotel_name,'required')+input('check_in','入住日期 *','date',x.check_in,'required')+input('check_out','退房日期 *','date',x.check_out,'required')+groupSel()+sel('place_id','Place',placeOpts())+input('address','地址','text',x.address,'',true)+input('google_maps_url','Google Maps','url',x.google_maps_url,'placeholder="https://…"',true)+sel('reservation_id','預訂關聯',resOpts())+input('booking_url','預訂網址（私人）','url',x.booking_url,'placeholder="https://…"',true)+input('confirmation_no','確認編號（私人）','text',x.confirmation_no,'',true)+area('notes','私人備註',x.notes)}else if(state.mode==='flights'){h+=input('date','日期 *','date',x.date||state.date,'required')+groupSel()+input('airline','航空公司 *','text',x.airline,'required')+input('flight_no','航班號 *','text',x.flight_no,'required')+input('departure_airport','出發機場 *','text',x.departure_airport,'required')+input('arrival_airport','抵達機場 *','text',x.arrival_airport,'required')+input('departure_time','起飛時間','time',x.departure_time)+input('arrival_time','抵達時間','time',x.arrival_time)+sel('reservation_id','預訂關聯',resOpts())+input('booking_reference','訂位代號（私人）','text',x.booking_reference,'',true)+area('notes','私人備註',x.notes)}else{h+=input('date','日期 *','date',x.date||state.date,'required')+sel('type','類型 *',opts(['train','bus','ferry','rental_car','airport_transfer','other'].map(function(v){return[v,labels[v]]})))+sel('from_place_id','出發地 *',placeOpts('— 請選擇 —'))+sel('to_place_id','目的地 *',placeOpts('— 請選擇 —'))+input('departure_time','出發時間','time',x.departure_time)+input('arrival_time','抵達時間','time',x.arrival_time)+input('operator','營運商','text',x.operator)+input('service_no','班次／車次','text',x.service_no)+groupSel()+sel('reservation_required','需要預訂',opts([['false','否'],['true','是']]))+sel('reservation_id','預訂關聯',resOpts())+input('url','相關網址（私人）','url',x.url,'placeholder="https://…"',true)+area('notes','私人備註',x.notes)}return h+'</div>'}
function setVal(id,v){var e=$('f_'+id);if(e&&v!=null)e.value=String(v).toLowerCase()==='true'&&id==='reservation_required'?'true':v}
function openForm(x){x=x||{};$('form').dataset.id=x.id||'';$('formTitle').textContent=(x.id?'編輯':'新增')+TITLES[state.mode];$('formFields').innerHTML=formHtml(x);Object.keys(x).forEach(function(k){setVal(k,x[k])});if(!x.id){if($('f_group'))$('f_group').value='all';if($('f_certainty'))$('f_certainty').value='confirmed';if($('f_category'))$('f_category').value='other';if($('f_status'))$('f_status').value='planned';if($('f_type'))$('f_type').value='train';if($('f_reservation_required'))$('f_reservation_required').value='false'}$('overlay').classList.add('open')}
function closeForm(){$('overlay').classList.remove('open')}
function collect(){var d={id:$('form').dataset.id||''};$('formFields').querySelectorAll('[id^="f_"]').forEach(function(e){d[e.id.substring(2)]=e.value});if(d.order!==undefined)d.order=Number(d.order);return d}
var SAVE={itinerary:'saveItinerary',reservations:'saveReservation',hotels:'saveHotel',flights:'saveFlight',transport:'saveTransport'};var DEL={itinerary:'deleteItinerary',reservations:'deleteReservation',hotels:'deleteHotel',flights:'deleteFlight',transport:'deleteTransport'};
async function submitForm(e){e.preventDefault();$('saveBtn').disabled=true;try{var r=await runServer(SAVE[state.mode],[collect()],15000);closeForm();toast(r.action==='created'?'已新增':'已更新');await load()}catch(err){alert('儲存失敗：'+err.message)}finally{$('saveBtn').disabled=false}}
async function removeItem(id){var x=(state[state.mode]||[]).find(function(r){return r.id===id});var s=summary(x);if(!confirm('確定刪除「'+s[0]+'」？'))return;try{await runServer(DEL[state.mode],[id],15000);toast('已刪除');await load()}catch(err){alert('刪除失敗：'+err.message)}}
$('addBtn').onclick=function(){openForm(null)};$('cancelBtn').onclick=closeForm;$('form').onsubmit=submitForm;$('overlay').onclick=function(e){if(e.target===$('overlay'))closeForm()};load();
</script>
</body></html>
