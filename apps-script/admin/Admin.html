<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Travel Planner Admin</title>
  <style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#202124;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.shell{max-width:760px;margin:auto;padding:16px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.top h1{font-size:22px;margin:0}.tabs{display:flex;background:#e9eaed;border-radius:11px;padding:3px;margin-bottom:14px}.tab{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-weight:700}.tab.active{background:white}.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#202124;color:white}.secondary{background:white;border:1px solid #dadce0}.danger{background:#fff1f0;color:#b3261e;border:1px solid #f2b8b5}.card{background:white;border:1px solid #e3e3e3;border-radius:14px;padding:14px;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar select,.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #c9c9c9;border-radius:9px;font:inherit;background:white}.toolbar select{width:auto;min-width:150px}.item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{margin:0 0 4px;font-size:16px}.meta{font-size:13px;color:#666}.actions{display:flex;gap:6px}.actions .btn{padding:8px 10px;font-size:13px}.empty,.status{color:#666;text-align:center;padding:20px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{background:white;width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}.sheet h2{margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.sheet-actions{display:flex;gap:8px;position:sticky;bottom:0;background:white;padding-top:10px}.sheet-actions .btn{flex:1}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#202124;color:white;padding:10px 14px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}@media(max-width:560px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.item{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.toolbar select{flex:1;min-width:0}}</style>
</head>
<body><div class="shell"><div class="top"><div><div class="meta">Planner 管理端</div><h1 id="pageTitle">行程管理</h1></div><button class="btn primary" id="addBtn">＋ 新增</button></div><div class="tabs"><button class="tab active" data-mode="itinerary">行程</button><button class="tab" data-mode="reservations">預訂</button></div><div class="toolbar" id="filters"></div><div id="list"><div class="status">載入中…</div></div></div>
<div class="overlay" id="overlay"><form class="sheet" id="form"><h2 id="formTitle"></h2><div id="formFields"></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelBtn">取消</button><button type="submit" class="btn primary" id="saveBtn">儲存</button></div></form></div><div class="toast" id="toast"></div>
<script>
const state={mode:'itinerary',itinerary:[],reservations:[],places:[],members:[],filters:{date:'',group:'all',status:'all'}};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const labels={ours:'我們',friends:'朋友',all:'全部',confirmed:'已確認',tentative:'暫定',optional:'可選',not_required:'不需預訂',planned:'規劃中',need_booking:'待預訂',booked:'已預訂',paid:'已付款',cancelled:'已取消',hotel:'住宿',flight:'航班',train:'火車',restaurant:'餐廳',activity:'活動',ticket:'票券',rental_car:'租車',other:'其他'};
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e?.message||String(e))))[name](...args))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
async function load(){try{const d=await call('getAdminBootstrap');Object.assign(state,{itinerary:d.itinerary||[],reservations:d.reservations||[],places:d.places||[],members:d.members||[]});render()}catch(e){$('list').innerHTML=`<div class="card">載入失敗：${esc(e.message)}</div>`}}
function setMode(mode){state.mode=mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));$('pageTitle').textContent=mode==='itinerary'?'行程管理':'預訂管理';render()}
function render(){renderFilters();state.mode==='itinerary'?renderItinerary():renderReservations()}
function groupOptions(){return '<option value="all">全部群組</option><option value="ours">我們</option><option value="friends">朋友</option><option value="common">共同</option>'}
function renderFilters(){const dates=[...new Set((state.mode==='itinerary'?state.itinerary:state.reservations).map(x=>x.date).filter(Boolean))].sort();$('filters').innerHTML=`<select id="dateFilter"><option value="">全部日期</option>${dates.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}</select><select id="groupFilter">${groupOptions()}</select>${state.mode==='reservations'?'<select id="statusFilter"><option value="all">全部狀態</option>'+['need_booking','planned','booked','paid','not_required','cancelled'].map(s=>`<option value="${s}">${labels[s]}</option>`).join('')+'</select>':''}<button class="btn secondary" id="reloadBtn">重新整理</button>`;$('dateFilter').value=state.filters.date;$('groupFilter').value=state.filters.group;if($('statusFilter'))$('statusFilter').value=state.filters.status;$('dateFilter').onchange=e=>{state.filters.date=e.target.value;render()};$('groupFilter').onchange=e=>{state.filters.group=e.target.value;render()};if($('statusFilter'))$('statusFilter').onchange=e=>{state.filters.status=e.target.value;render()};$('reloadBtn').onclick=load}
function groupMatch(x){const g=state.filters.group;return g==='all'||(g==='common'?x.group==='all':x.group===g)}
function renderItinerary(){const a=state.itinerary.filter(x=>(!state.filters.date||x.date===state.filters.date)&&groupMatch(x)).sort((a,b)=>String(a.date).localeCompare(String(b.date))||Number(a.order||0)-Number(b.order||0));$('list').innerHTML=a.length?a.map(x=>card(x.id,`${x.start_time||'—'} · ${x.title}`,`${x.date} · ${labels[x.group]||x.group} · ${x.city||''}`,`${labels[x.certainty]||x.certainty} · order ${x.order||''}`)).join(''):'<div class="card empty">目前沒有符合條件的行程。</div>';bindActions(a,'itinerary')}
function renderReservations(){const member=id=>state.members.find(m=>m.id===id)?.name||id||'未指定';const a=state.reservations.filter(x=>(!state.filters.date||x.date===state.filters.date)&&groupMatch(x)&&(state.filters.status==='all'||x.status===state.filters.status)).sort((a,b)=>String(a.date||'9999').localeCompare(String(b.date||'9999'))||String(a.time||'').localeCompare(String(b.time||'')));$('list').innerHTML=a.length?a.map(x=>card(x.id,`${labels[x.category]||x.category} · ${x.name}`,`${x.date||'未指定日期'} ${x.time||''} · ${labels[x.group]||x.group}`,`${labels[x.status]||x.status} · 負責：${member(x.owner_member_id)}`)).join(''):'<div class="card empty">目前沒有符合條件的預訂。</div>';bindActions(a,'reservations')}
function card(id,title,m1,m2){return `<div class="card item"><div><h3>${esc(title)}</h3><div class="meta">${esc(m1)}</div><div class="meta">${esc(m2)}</div></div><div class="actions"><button class="btn secondary" data-edit="${esc(id)}">編輯</button><button class="btn danger" data-delete="${esc(id)}">刪除</button></div></div>`}
function bindActions(items,mode){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(items.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeItem(b.dataset.delete,mode))}
function field(id,label,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input id="f_${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(id,label,options,value=''){return `<div class="field"><label>${label}</label><select id="f_${id}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function textarea(id,label,value=''){return `<div class="field full"><label>${label}</label><textarea id="f_${id}" rows="3">${esc(value)}</textarea></div>`}
function openForm(item){$('form').dataset.id=item?.id||'';$('formTitle').textContent=(item?'編輯':'新增')+(state.mode==='itinerary'?'行程':'預訂');$('formFields').innerHTML=state.mode==='itinerary'?itineraryForm(item||{}):reservationForm(item||{});$('overlay').classList.add('open')}
function itineraryForm(x){const places=[['','— 無 —'],...state.places.map(p=>[p.id,`${p.city||''} · ${p.name||p.id}`])];return `<div class="grid">${field('date','日期 *','date',x.date||state.filters.date||'2026-12-21','required')}${selectField('group','群組 *',[['ours','我們'],['friends','朋友'],['all','全部']],x.group||'all')}${field('start_time','開始時間','time',x.start_time||'')}${field('end_time','結束時間','time',x.end_time||'')}${field('title','標題 *','text',x.title||'','required maxlength="120"')}${field('city','城市','text',x.city||'')}${selectField('certainty','確定程度 *',[['confirmed','已確認'],['tentative','暫定'],['optional','可選']],x.certainty||'confirmed')}${selectField('place_id','地點',places,x.place_id||'')}${field('order','排序 *','number',x.order||10,'min="0" required')}${textarea('description','說明',x.description||'')}${textarea('notes','私人備註',x.notes||'')}</div>`}
function reservationForm(x){const cats=['hotel','flight','train','restaurant','activity','ticket','rental_car','other'].map(v=>[v,labels[v]]),statuses=['not_required','planned','need_booking','booked','paid','cancelled'].map(v=>[v,labels[v]]),members=[['','— 未指定 —'],...state.members.filter(m=>String(m.active).toUpperCase()!=='FALSE').map(m=>[m.id,`${m.name} (${labels[m.group]||m.group})`])];return `<div class="grid">${selectField('category','類別 *',cats,x.category||'other')}${field('name','名稱 *','text',x.name||'','required maxlength="160"')}${field('date','日期','date',x.date||state.filters.date||'')}${field('time','時間','time',x.time||'')}${selectField('group','群組 *',[['ours','我們'],['friends','朋友'],['all','全部']],x.group||'all')}${selectField('status','狀態 *',statuses,x.status||'planned')}${selectField('owner_member_id','負責人',members,x.owner_member_id||'')}${field('deadline','預訂期限','date',x.deadline||'')}${field('price','價格','number',x.price||'','min="0" step="0.01"')}${field('currency','幣別','text',x.currency||'JPY','maxlength="8"')}${field('booking_url','預訂網址','url',x.booking_url||'','placeholder="https://…"')}${field('confirmation_no','確認編號','text',x.confirmation_no||'','maxlength="120"')}${textarea('notes','私人備註',x.notes||'')}</div>`}
function closeForm(){$('overlay').classList.remove('open')}
function formData(keys){const d={id:$('form').dataset.id||''};keys.forEach(k=>d[k]=$('f_'+k)?.value??'');return d}
async function submitForm(e){e.preventDefault();$('saveBtn').disabled=true;try{let r;if(state.mode==='itinerary'){const d=formData(['date','group','start_time','end_time','title','city','certainty','place_id','order','description','notes']);d.order=Number(d.order);r=await call('saveItinerary',d)}else{const d=formData(['category','name','date','time','group','status','owner_member_id','booking_url','deadline','price','currency','confirmation_no','notes']);r=await call('saveReservation',d)}closeForm();toast(r.action==='created'?'已新增':'已更新');await load()}catch(err){alert('儲存失敗：'+err.message)}finally{$('saveBtn').disabled=false}}
async function removeItem(id,mode){const arr=mode==='itinerary'?state.itinerary:state.reservations,item=arr.find(x=>x.id===id);if(!confirm(`確定刪除「${item?.title||item?.name||id}」？`))return;try{await call(mode==='itinerary'?'deleteItinerary':'deleteReservation',id);toast('已刪除');await load()}catch(err){alert('刪除失敗：'+err.message)}}
$('addBtn').onclick=()=>openForm(null);$('cancelBtn').onclick=closeForm;$('form').onsubmit=submitForm;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeForm()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));load();
</script></body></html>
