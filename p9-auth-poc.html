<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>Travel Planner Admin 登入</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#202124;background:#f7f7f8}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:#f7f7f8;color:#202124}
.shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.card{width:min(100%,460px);background:#fff;border:1px solid #e3e3e3;border-radius:22px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.brand{font-size:14px;font-weight:700;letter-spacing:.02em;color:#666;margin-bottom:10px}.icon{width:54px;height:54px;border-radius:16px;background:#202124;color:#fff;display:grid;place-items:center;font-size:27px;margin-bottom:18px}
h1{font-size:28px;line-height:1.25;margin:0 0 8px}.lead{color:#666;font-size:16px;line-height:1.65;margin:0 0 22px}
.btn{width:100%;min-height:52px;border-radius:13px;border:0;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:default}.primary{background:#202124;color:#fff}.secondary{margin-top:10px;background:#fff;border:1px solid #dadce0;color:#202124}
.status{display:none;margin:18px 0 0;padding:13px 14px;border-radius:12px;background:#f7f8f9;border:1px solid #e3e3e3;font-size:14px;line-height:1.55}.status.show{display:block}.status.error{background:#fff8f7;border-color:#f2b8b5;color:#8a1c12}.status.ok{background:#eef7ee;border-color:#b7d7b7;color:#176b2c}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-3px;margin-right:8px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:20px;text-align:center;color:#8a8a8a;font-size:12px;line-height:1.5}
@media(max-width:520px){.shell{align-items:stretch;padding:0}.card{width:100%;min-height:100dvh;border:0;border-radius:0;box-shadow:none;padding:calc(42px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}.icon{width:58px;height:58px}.btn{min-height:54px;font-size:17px}.lead{font-size:17px}}
</style>
</head>
<body>
<main class="shell">
  <section class="card" aria-live="polite">
    <div class="icon" aria-hidden="true">✈︎</div>
    <div class="brand">Travel Planner</div>
    <h1 id="title">行程管理</h1>
    <p class="lead" id="lead">使用 Google 帳戶登入，以管理旅程內容。</p>
    <button class="btn primary" id="loginBtn" type="button">使用 Google 帳戶登入</button>
    <button class="btn secondary" id="travelerBtn" type="button">返回旅客端</button>
    <div class="status" id="status"></div>
    <div class="footer">管理權限由 Travel Planner 成員設定決定。</div>
  </section>
</main>
<script>
(function(){'use strict';
  const ENDPOINT_KEY='travelPlanner.p9AuthEndpoint.v1';
  const SESSION_KEY='travelPlanner.p9Session.v1';
  const RETURN_KEY='travelPlanner.p11ReturnTo.v1';
  const ADMIN_PATH='/travel-planner-web/admin.html';
  const TRAVELER_PATH='/travel-planner-web/';

  const title=document.getElementById('title');
  const lead=document.getElementById('lead');
  const loginBtn=document.getElementById('loginBtn');
  const travelerBtn=document.getElementById('travelerBtn');
  const status=document.getElementById('status');

  function endpoint(){return String(localStorage.getItem(ENDPOINT_KEY)||'').trim();}
  function token(){return String(localStorage.getItem(SESSION_KEY)||'').trim();}
  function callbackUrl(){return location.origin+location.pathname;}
  function travelerUrl(){return location.origin+TRAVELER_PATH;}
  function defaultAdminUrl(){return location.origin+ADMIN_PATH;}
  function clearOAuthQuery(){if(location.search||location.hash)history.replaceState(null,'',location.pathname);}
  function setBusy(message){
    title.textContent='正在完成登入';
    lead.textContent='正在確認你的 Google 帳戶與管理權限。';
    loginBtn.hidden=true;
    travelerBtn.hidden=true;
    status.className='status show';
    status.innerHTML='<span class="spinner" aria-hidden="true"></span>'+message;
  }
  function showIdle(){
    title.textContent='行程管理';
    lead.textContent='使用 Google 帳戶登入，以管理旅程內容。';
    loginBtn.hidden=false;loginBtn.disabled=false;loginBtn.textContent='使用 Google 帳戶登入';travelerBtn.hidden=false;
    status.className='status';status.textContent='';
  }
  function showError(message,forbidden){
    title.textContent=forbidden?'沒有管理權限':'登入未完成';
    lead.textContent=forbidden?'這個 Google 帳戶目前無法使用行程管理功能。':'請重新登入，或返回旅客端稍後再試。';
    loginBtn.hidden=false;loginBtn.disabled=false;loginBtn.textContent=forbidden?'使用其他 Google 帳戶':'重新登入';
    travelerBtn.hidden=false;
    status.className='status show error';status.textContent=message;
  }
  function errorCode(data){
    if(!data)return '';
    if(data.error&&typeof data.error==='object')return String(data.error.code||'');
    return String(data.code||'');
  }
  function errorMessage(data,fallback){
    if(data&&data.error&&typeof data.error==='object'&&data.error.message)return String(data.error.message);
    if(data&&typeof data.error==='string'&&data.error)return data.error;
    if(data&&data.message)return String(data.message);
    return fallback;
  }
  function safeAdminTarget(){
    const raw=String(localStorage.getItem(RETURN_KEY)||'').trim();
    if(raw){
      try{
        const u=new URL(raw,location.origin);
        if(u.origin===location.origin&&/^\/travel-planner-web\/(admin\.html|admin-p11\.html)$/.test(u.pathname))return defaultAdminUrl();
      }catch(_){}
    }
    return defaultAdminUrl();
  }
  function goAdmin(){localStorage.removeItem(RETURN_KEY);location.replace(safeAdminTarget());}
  function clearSession(){localStorage.removeItem(SESSION_KEY);}

  async function sessionCheck(){
    const base=endpoint(),sessionToken=token();
    if(!base||!sessionToken)return null;
    const r=await fetch(base,{method:'POST',body:new URLSearchParams({mode:'session_check',session_token:sessionToken}),redirect:'follow'});
    const data=await r.json();
    if(!data.session_valid)clearSession();
    return data;
  }

  async function startLogin(){
    const base=endpoint();
    if(!base){showError('目前無法連線到管理服務。請返回旅客端後再試一次。',false);return;}
    loginBtn.disabled=true;
    setBusy('正在前往 Google 登入…');
    try{
      const r=await fetch(base+'?mode=auth_start&return_url='+encodeURIComponent(callbackUrl()),{redirect:'follow'});
      const data=await r.json();
      if(!r.ok||!data.ok||!data.auth_url)throw new Error(errorMessage(data,'無法建立 Google 登入請求。'));
      location.href=data.auth_url;
    }catch(e){showError(e&&e.message?e.message:'無法建立 Google 登入請求。',false);}
  }

  async function finishOAuth(){
    const q=new URLSearchParams(location.search);
    const code=q.get('code'),state=q.get('state'),oauthError=q.get('error');
    if(!code&&!oauthError)return false;
    clearOAuthQuery();
    const base=endpoint();
    if(!base){showError('登入已返回，但目前無法連線到管理服務。',false);return true;}
    setBusy('Google 已驗證，正在建立管理工作階段…');
    try{
      const r=await fetch(base,{method:'POST',body:new URLSearchParams({mode:'auth_finish',state:state||'',code:code||'',oauth_error:oauthError||''}),redirect:'follow'});
      const data=await r.json();
      if(data.session_token)localStorage.setItem(SESSION_KEY,data.session_token);
      if(!data.session_token){
        const codeValue=errorCode(data);
        showError(errorMessage(data,oauthError?'Google 登入已取消或未完成。':'無法完成登入。'),codeValue==='FORBIDDEN');
        return true;
      }
      setBusy('正在確認管理權限…');
      const session=await sessionCheck();
      if(session&&session.session_valid&&session.admin){goAdmin();return true;}
      const codeValue=errorCode(session);
      showError(errorMessage(session,'此帳戶目前無法使用行程管理功能。'),!!(session&&session.session_valid&&!session.admin)||codeValue==='FORBIDDEN');
    }catch(e){showError('完成登入時發生連線錯誤，請重新登入。',false);}
    return true;
  }

  loginBtn.addEventListener('click',startLogin);
  travelerBtn.addEventListener('click',function(){location.href=travelerUrl();});

  (async function init(){
    const handled=await finishOAuth();
    if(handled)return;
    if(!endpoint()){showError('目前無法連線到管理服務。請返回旅客端後再試一次。',false);return;}
    if(!token()){showIdle();return;}
    setBusy('正在確認目前的登入狀態…');
    try{
      const session=await sessionCheck();
      if(session&&session.session_valid&&session.admin){goAdmin();return;}
      if(session&&session.session_valid&&!session.admin){showError('此 Google 帳戶目前沒有 Admin 管理權限。',true);return;}
      showIdle();
    }catch(_){showError('目前無法確認登入狀態，請稍後再試。',false);}
  })();
})();
</script>
</body>
</html>
