}.toolbar select{min-width:0;width:100%;min-height:50px;font-size:16px}.toolbar #reloadBtn{grid-column:1/-1}.card{padding:17px;border-radius:17px}.item{flex-direction:column;gap:14px}.item h3{font-size:19px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%}.actions .btn{min-height:46px;font-size:15px}.overlay{align-items:stretch;background:#fff}.sheet{max-width:none;max-height:none;height:100dvh;border-radius:0;padding:calc(18px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));overscroll-behavior:contain}.sheet h2{font-size:25px}.grid{grid-template-columns:1fr;gap:17px}.field.full,.location-status{grid-column:auto}.field label{font-size:15px}.field input,.field select,.field textarea{min-height:52px;padding:13px 14px;font-size:17px;border-radius:12px}.field textarea{min-height:110px}.sheet-actions{margin:20px -14px -10px;padding:12px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ececec}.toast{bottom:calc(18px + env(safe-area-inset-bottom));max-width:calc(100vw - 28px);font-size:15px;text-align:center}}

<div class="shell"><div class="top"><div><div class="meta">Planner 管理端 · P11 isolated</div><h1 id="pageTitle">行程管理</h1><div class="admin-id" id="adminIdentity"></div></div><div class="top-actions"><button class="btn secondary" id="logoutBtn" hidden>登出</button><button class="btn primary" id="addBtn" hidden>＋ 新增</button></div></div><div id="authPanel"></div><div id="adminPanel" hidden><div class="tabs" id="tabs"></div><div class="toolbar" id="filters"></div><div id="quality"></div><div id="list"><div class="status">載入中…</div></div></div></div><div class="overlay" id="overlay"><form class="sheet" id="form"><h2 id="formTitle"></h2><div id="formFields"></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelBtn">取消</button><button type="submit" class="btn primary" id="saveBtn">儲存</button></div></form></div><div class="toast" id="toast"></div>
<script>
(function(){'use strict';
var ENDPOINT_KEY='travelPlanner.p9AuthEndpoint.v1',SESSION_KEY='travelPlanner.p9Session.v1',RETURN_KEY='travelPlanner.p11ReturnTo.v1',LOGIN_PAGE='p9-auth-poc.html';
var MODES=['itinerary','reservations','hotels','flights','transport','places'];var TITLES={itinerary:'行程',reservations:'預訂',hotels:'住宿',flights:'航班',transport:'交通',places:'地點'};var SAVE={itinerary:'save_itinerary',reservations:'save_reservation',hotels:'save_hotel',flights:'save_flight',transport:'save_transport',places:'save_place'};var DEL={itinerary:'delete_itinerary',reservations:'delete_reservation',hotels:'delete_hotel',flights:'delete_flight',transport:'delete_transport',places:'delete_place'};var state={mode:'itinerary',itinerary:[],reservations:[],hotels:[],flights:[],transport:[],places:[],members:[],date:'',group:'all',status:'all',currentAdmin:null,enums:{}};var labels={ours:'郭小鼠組',friends:'阿香組',all:'全部',common:'共同',confirmed:'已確認',tentative:'暫定',optional:'可選',not_required:'不需預訂',planned:'規劃中',need_booking:'待預訂',booked:'已預訂',paid:'已付款',cancelled:'已取消',hotel:'住宿',flight:'航班',train:'火車',bus:'巴士',ferry:'渡輪',restaurant:'餐廳',activity:'活動',ticket:'票券',rental_car:'租車',airport_transfer:'機場接送',station:'車站',airport:'機場',attraction:'景點',shop:'商店',other:'其他'};
function $(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function endpoint(){return String(localStorage.getItem(ENDPOINT_KEY)||'').trim()}function token(){return String(localStorage.getItem(SESSION_KEY)||'').trim()}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},2500)}function apiError(data){var e=new Error((data&&data.error&&data.error.message)||'API 呼叫失敗');e.code=(data&&data.error&&data.error.code)||'INTERNAL_ERROR';return e}
async function post(params,timeoutMs){var base=endpoint();if(!base)throw Object.assign(new Error('尚未設定 Apps Script API URL，請先回 P9/P10 測試頁設定。'),{code:'NO_ENDPOINT'});var controller=new AbortController(),timer=setTimeout(function(){controller.abort()},timeoutMs||20000);try{var r=await fetch(base,{method:'POST',body:new URLSearchParams(params),redirect:'follow',signal:controller.signal});return await r.json()}catch(e){if(e.name==='AbortError')throw Object.assign(new Error('Apps Script 回應逾時'),{code:'TIMEOUT'});throw e}finally{clearTimeout(timer)}}
async function adminApi(action,options){options=options||{};var t=token();if(!t)throw Object.assign(new Error('尚未登入'),{code:'UNAUTHENTICATED'});var params={mode:'admin_api',action:action,session_token:t};if(options.payload!==undefined)params.payload=JSON.stringify(options.payload);if(options.id!==undefined)params.id=String(options.id);var data=await post(params,25000);if(!data.ok)throw apiError(data);return data.data}
function clearSession(){localStorage.removeItem(SESSION_KEY)}function login(){localStorage.setItem(RETURN_KEY,location.href);location.href=LOGIN_PAGE}async function logout(){var t=token();try{if(t)await post({mode:'session_logout',session_token:t},15000)}catch(_){}clearSession();showAuth('SIGNED_OUT')}function authMessage(code){if(code==='SESSION_EXPIRED')return '登入已過期，請重新登入。';if(code==='SESSION_REVOKED')return '此工作階段已登出，請重新登入。';if(code==='FORBIDDEN')return '此 Google 帳戶目前沒有 Admin 管理權限。';if(code==='NO_ENDPOINT')return '找不到 P9/P10 Apps Script API URL。請先完成 P10 測試頁設定。';return '請先使用 Google 登入 Admin。'}function showAuth(code){$('adminPanel').hidden=true;$('addBtn').hidden=true;$('logoutBtn').hidden=!token();$('adminIdentity').textContent='';$('authPanel').innerHTML='<div class="card auth-card '+(code==='FORBIDDEN'?'error':'')+'"><h2>Travel Planner Admin</h2><div>'+esc(authMessage(code))+'</div><button class="btn primary" id="loginBtn" style="margin-top:14px">使用 Google 登入</button></div>';$('loginBtn').onclick=login}
function handleApiError(e,context){var code=e&&e.code||'INTERNAL_ERROR';if(code==='UNAUTHENTICATED'||code==='SESSION_EXPIRED'||code==='SESSION_REVOKED'){clearSession();showAuth(code);return}if(code==='FORBIDDEN'){showAuth('FORBIDDEN');return}if(code==='VALIDATION_ERROR'){alert((context||'操作')+'失敗：'+e.message);return}if(code==='CONFLICT'){alert('無法刪除：'+e.message);return}if(code==='NOT_FOUND'){toast('資料已變更，正在重新整理');load();return}alert((context||'操作')+'失敗：'+(e.message||e))}
async function verifyAndLoad(){if(!token()){showAuth('UNAUTHENTICATED');return}try{var s=await post({mode:'session_check',session_token:token()},15000);if(!s.session_valid)throw apiError(s);if(!s.admin)throw Object.assign(new Error('沒有 Admin 權限'),{code:'FORBIDDEN'});await load()}catch(e){handleApiError(e,'驗證登入')}}async function load(){$('authPanel').innerHTML='';$('adminPanel').hidden=false;$('addBtn').hidden=false;$('logoutBtn').hidden=false;$('list').innerHTML='<div class="status">正在讀取 Google Sheet…</div>';try{var d=await adminApi('bootstrap');MODES.forEach(function(m){state[m]=Array.isArray(d[m])?d[m]:[]});state.members=Array.isArray(d.members)?d.members:[];state.currentAdmin=d.current_admin||null;state.enums=d.enums||{};if(!state.date)state.date=smartDate();$('adminIdentity').textContent=state.currentAdmin?'目前登入：'+(state.currentAdmin.name||state.currentAdmin.email):'';render()}catch(e){handleApiError(e,'載入 Admin')}}
function smartDate(){var dates=[];state.itinerary.forEach(function(x){if(x.date&&dates.indexOf(x.date)<0)dates.push(x.date)});dates.sort();if(!dates.length)return'';var now=new Date(),today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');if(today<dates[0])return dates[0];if(today>dates[dates.length-1])return dates[dates.length-1];if(dates.indexOf(today)>=0)return today;for(var i=0;i<dates.length;i++)if(dates[i]>=today)return dates[i];return dates[dates.length-1]}function buildTabs(){$('tabs').innerHTML=MODES.map(function(m){return'<button class="tab '+(m===state.mode?'active':'')+'" data-mode="'+m+'">'+TITLES[m]+'</button>'}).join('');document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){state.mode=t.dataset.mode;state.status='all';$('pageTitle').textContent=TITLES[state.mode]+'管理';render()}})}function hasDate(){return['itinerary','reservations','flights','transport'].indexOf(state.mode)>=0}function groupMatch(x){if(state.mode==='places'||state.group==='all')return true;if(state.group==='common')return x.group==='all';return x.group===state.group}function filtered(){var rows=(state[state.mode]||[]).filter(groupMatch);if(state.date&&hasDate())rows=rows.filter(function(x){return x.date===state.date});if(state.mode==='reservations'&&state.status!=='all')rows=rows.filter(function(x){return x.status===state.status});return rows.sort(function(a,b){return String(a.date||a.check_in||'9999').localeCompare(String(b.date||b.check_in||'9999'))||String(a.start_time||a.time||a.departure_time||'').localeCompare(String(b.start_time||b.time||b.departure_time||''))||Number(a.order||0)-Number(b.order||0)})}
function renderFilters(){var rows=state[state.mode]||[],dates=[];rows.forEach(function(x){if(x.date&&dates.indexOf(x.date)<0)dates.push(x.date)});dates.sort();var html='';if(hasDate())html+='<select id="dateFilter"><option value="">全部日期</option>'+dates.map(function(d){return'<option value="'+esc(d)+'">'+esc(d)+'</option>'}).join('')+'</select>';if(state.mode!=='places')html+='<select id="groupFilter"><option value="all">全部群組</option><option value="ours">郭小鼠組</option><option value="friends">阿香組</option><option value="common">共同</option></select>';if(state.mode==='reservations')html+='<select id="statusFilter"><option value="all">全部狀態</option>'+['need_booking','planned','booked','paid','not_required','cancelled'].map(function(v){return'<option value="'+v+'">'+labels[v]+'</option>'}).join('')+'</select>';html+='<button class="btn secondary" id="reloadBtn">重新整理</button>';$('filters').innerHTML=html;if($('dateFilter')){$('dateFilter').value=state.date;$('dateFilter').onchange=function(e){state.date=e.target.value;renderList();renderQuality()}}if($('groupFilter')){$('groupFilter').value=state.group;$('groupFilter').onchange=function(e){state.group=e.target.value;renderList();renderQuality()}}if($('statusFilter')){$('statusFilter').value=state.status;$('statusFilter').onchange=function(e){state.status=e.target.value;renderList();renderQuality()}}$('reloadBtn').onclick=load}
function placeName(id){var p=state.places.find(function(x){return x.id===id});return p?p.name:(id||'—')}function memberName(id){var m=state.members.find(function(x){return x.id===id});return m?m.name:(id||'未指定')}function qualityWarnings(mode,x){var w=[];function hr(id){return!id||state.reservations.some(function(r){return r.id===id})}function hp(id){return!id||state.places.some(function(p){return p.id===id})}function ht(id){return!id||state.transport.some(function(t){return t.id===id})}if(mode==='itinerary'){if(x.place_id&&!hp(x.place_id))w.push('地點關聯不存在：'+x.place_id);if(x.transport_id&&!ht(x.transport_id))w.push('交通關聯不存在：'+x.transport_id);if(x.reservation_id&&!hr(x.reservation_id))w.push('預訂關聯不存在：'+x.reservation_id)}if(mode==='reservations'&&(x.status==='need_booking'||x.status==='planned')&&!x.deadline)w.push('尚未設定預訂期限');if(mode==='hotels'&&!x.reservation_id)w.push('住宿尚未連結預訂資料');if(mode==='flights'&&!x.reservation_id)w.push('航班尚未連結預訂資料');if(mode==='transport'&&String(x.reservation_required).toLowerCase()==='true'&&!x.reservation_id)w.push('需要預訂但尚未連結 reservation_id');if(mode==='places'){if(!(x.latitude&&x.longitude))w.push('尚未完成自動定位');if(!x.city)w.push('尚未設定城市')}return w}function renderQuality(){var count=0;filtered().forEach(function(x){if(qualityWarnings(state.mode,x).length)count++});$('quality').innerHTML='<span class="quality-pill '+(count?'bad':'')+'">資料品質：'+(count?count+' 筆需注意':'目前正常')+'</span>'}
function summary(x){if(state.mode==='itinerary')return[(x.start_time||'—')+' · '+x.title,x.date+' · '+(labels[x.group]||x.group)+' · '+(x.city||''),(labels[x.certainty]||x.certainty)+' · order '+(x.order||'')];if(state.mode==='reservations')return[(labels[x.category]||x.category)+' · '+x.name,(x.date||'未指定日期')+' '+(x.time||'')+' · '+(labels[x.group]||x.group),(labels[x.status]||x.status)+' · 負責：'+memberName(x.owner_member_id)];if(state.mode==='hotels')return[x.hotel_name,x.city+' · '+x.check_in+' → '+x.check_out,(labels[x.group]||x.group)+(x.reservation_id?' · '+x.reservation_id:'')];if(state.mode==='flights')return[(x.airline||'')+' '+(x.flight_no||''),x.date+' · '+x.departure_airport+' → '+x.arrival_airport,(x.departure_time||'—')+' → '+(x.arrival_time||'—')+' · '+(labels[x.group]||x.group)];if(state.mode==='places')return[x.name,(x.city||'未指定城市')+(x.category?' · '+(labels[x.category]||x.category):''),(x.latitude&&x.longitude?'✓ 已定位 · '+x.latitude+', '+x.longitude:'尚未定位')+(x.address?' · '+x.address:'')];return[(labels[x.type]||x.type)+' · '+placeName(x.from_place_id)+' → '+placeName(x.to_place_id),x.date+' '+(x.departure_time||'')+' · '+(labels[x.group]||x.group),(x.operator||'')+' '+(x.service_no||'')+(x.reservation_id?' · '+x.reservation_id:'')]}
function renderList(){var rows=filtered();if(!rows.length){$('list').innerHTML='<div class="card empty">目前沒有符合條件的'+TITLES[state.mode]+'資料。</div>';return}$('list').innerHTML=rows.map(function(x){var s=summary(x),w=qualityWarnings(state.mode,x),wh=w.length?'<div class="warning-title">⚠ 需要注意</div>'+w.map(function(t){return'<div class="warning-line">• '+esc(t)+'</div>'}).join(''):'';return'<div class="card item '+(w.length?'warning':'')+'"><div><h3>'+esc(s[0])+'</h3><div class="meta">'+esc(s[1])+'</div><div class="meta">'+esc(s[2])+'</div>'+wh+'</div><div class="actions"><button class="btn secondary" data-copy="'+esc(x.id)+'">複製</button><button class="btn secondary" data-edit="'+esc(x.id)+'">編輯</button><button class="btn danger" data-delete="'+esc(x.id)+'">刪除</button></div></div>'}).join('');document.querySelectorAll('[data-copy]').forEach(function(b){b.onclick=function(){openForm((state[state.mode]||[]).find(function(x){return x.id===b.dataset.copy}),true)}});document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){openForm((state[state.mode]||[]).find(function(x){return x.id===b.dataset.edit}),false)}});document.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){removeItem(b.dataset.delete)}})}function render(){buildTabs();renderFilters();renderQuality();renderList()}
function opts(a,blank){var x=blank?[['',blank]].concat(a):a;return x.map(function(i){return'<option value="'+esc(i[0])+'">'+esc(i[1])+'</option>'}).join('')}function input(id,label,type,value,extra,full){return'<div class="field '+(full?'full':'')+'"><label>'+label+'</label><input id="f_'+id+'" type="'+(type||'text')+'" value="'+esc(value||'')+'" '+(extra||'')+'></div>'}function sel(id,label,html,full){return'<div class="field '+(full?'full':'')+'"><label>'+label+'</label><select id="f_'+id+'">'+html+'</select></div>'}function area(id,label,value){return'<div class="field full"><label>'+label+'</label><textarea id="f_'+id+'" rows="3">'+esc(value||'')+'</textarea></div>'}function locationStatus(x){var ok=x&&x.latitude&&x.longitude;return'<div class="location-status '+(ok?'ok':'warn')+'"><strong>'+(ok?'✓ 已定位':'儲存時會自動定位')+'</strong><div>'+(ok?'目前座標：'+esc(x.latitude)+', '+esc(x.longitude):'系統會依地址或地點名稱＋城市自動定位。')+'</div></div>'}function enumList(key,fallback){return Array.isArray(state.enums[key])&&state.enums[key].length?state.enums[key]:fallback}function groupSel(){return sel('group','群組 *',opts(enumList('group',['ours','friends','all']).map(function(v){return[v,labels[v]||v]})))}function placeOpts(blank){return opts(state.places.map(function(p){return[p.id,(p.city||'')+' · '+(p.name||p.id)]}),blank||'— 未指定 —')}function resOpts(){return opts(state.reservations.map(function(r){return[r.id,(labels[r.category]||r.category)+' · '+r.name]}),'— 未連結 —')}function transOpts(){return opts(state.transport.map(function(t){return[t.id,(labels[t.type]||t.type)+' · '+placeName(t.from_place_id)+' → '+placeName(t.to_place_id)]}),'— 未連結 —')}
function formHtml(x){var h='<div class="grid">',d=x.date||state.date||smartDate();if(state.mode==='itinerary'){h+=input('date','日期 *','date',d,'required')+groupSel()+input('start_time','開始時間','time',x.start_time)+input('end_time','結束時間','time',x.end_time)+input('title','標題 *','text',x.title,'required maxlength="120"',true)+input('city','城市','text',x.city)+sel('certainty','確定程度 *',opts(enumList('certainty',['confirmed','tentative','optional']).map(function(v){return[v,labels[v]||v]})))+sel('place_id','地點',placeOpts())+sel('transport_id','交通關聯',transOpts())+sel('reservation_id','預訂關聯',resOpts())+area('description','說明',x.description)+area('notes','私人備註',x.notes)}else if(state.mode==='reservations'){h+=sel('category','類別 *',opts(enumList('reservation_category',['hotel','flight','train','restaurant','activity','ticket','rental_car','other']).map(function(v){return[v,labels[v]||v]})))+input('name','名稱 *','text',x.name,'required maxlength="160"')+input('date','日期','date',d)+input('time','時間','time',x.time)+groupSel()+sel('status','狀態 *',opts(enumList('reservation_status',['not_required','planned','need_booking','booked','paid','cancelled']).map(function(v){return[v,labels[v]||v]})))+sel('owner_member_id','負責人',opts(state.members.map(function(m){return[m.id,m.name+' ('+(labels[m.group]||m.group)+')']}),'— 未指定 —'))+input('deadline','預訂期限','date',x.deadline)+input('price','價格','number',x.price,'min="0" step="0.01"')+input('currency','幣別','text',x.currency||'JPY')+input('booking_url','預訂網址','url',x.booking_url,'placeholder="https://…"',true)+input('confirmation_no','確認編號','text',x.confirmation_no,'',true)+area('notes','私人備註',x.notes)}else if(state.mode==='hotels'){h+=input('city','城市 *','text',x.city,'required')+input('hotel_name','住宿名稱 *','text',x.hotel_name,'required')+input('check_in','入住日期 *','date',x.check_in||d,'required')+input('check_out','退房日期 *','date',x.check_out,'required')+groupSel()+sel('place_id','Place',placeOpts())+input('address','地址','text',x.address,'',true)+input('google_maps_url','Google Maps','url',x.google_maps_url,'placeholder="https://…"',true)+sel('reservation_id','預訂關聯',resOpts())+input('booking_url','預訂網址（私人）','url',x.booking_url,'placeholder="https://…"',true)+input('confirmation_no','確認編號（私人）','text',x.confirmation_no,'',true)+area('notes','私人備註',x.notes)}else if(state.mode==='flights'){h+=input('date','日期 *','date',d,'required')+groupSel()+input('airline','航空公司 *','text',x.airline,'required')+input('flight_no','航班號 *','text',x.flight_no,'required')+input('departure_airport','出發機場 *','text',x.departure_airport,'required')+input('arrival_airport','抵達機場 *','text',x.arrival_airport,'required')+input('departure_time','起飛時間','time',x.departure_time)+input('arrival_time','抵達時間','time',x.arrival_time)+sel('reservation_id','預訂關聯',resOpts())+input('booking_reference','訂位代號（私人）','text',x.booking_reference,'',true)+area('notes','私人備註',x.notes)}else if(state.mode==='places'){h+=input('name','地點名稱 *','text',x.name,'required maxlength="160"',true)+input('city','城市','text',x.city)+sel('category','分類',opts(enumList('place_category',['station','airport','hotel','restaurant','attraction','shop','other']).map(function(v){return[v,labels[v]||v]})))+input('address','地址','text',x.address,'placeholder="建議填寫完整地址，可提高定位準確度"',true)+locationStatus(x)+input('website','官方網站','url',x.website,'placeholder="https://…"',true)+area('opening_hours','營業時間',x.opening_hours)+area('notes','備註',x.notes)}else{h+=input('date','日期 *','date',d,'required')+sel('type','類型 *',opts(enumList('transport_type',['train','bus','ferry','rental_car','airport_transfer','other']).map(function(v){return[v,labels[v]||v]})))+sel('from_place_id','出發地 *',placeOpts('— 請選擇 —'))+sel('to_place_id','目的地 *',placeOpts('— 請選擇 —'))+input('departure_time','出發時間','time',x.departure_time)+input('arrival_time','抵達時間','time',x.arrival_time)+input('operator','營運商','text',x.operator)+input('service_no','班次／車次','text',x.service_no)+groupSel()+sel('reservation_required','需要預訂',opts([['false','否'],['true','是']]))+sel('reservation_id','預訂關聯',resOpts())+input('url','相關網址（私人）','url',x.url,'placeholder="https://…"',true)+area('notes','私人備註',x.notes)}return h+'</div>'}
function setVal(id,value){var e=$('f_'+id);if(!e||value==null)return;if(id==='reservation_required'){e.value=String(value).toLowerCase()==='true'?'true':'false';return}e.value=value}function openForm(source,isCopy){source=source||{};var data={};Object.keys(source).forEach(function(k){data[k]=source[k]});if(isCopy)delete data.id;$('form').dataset.id=isCopy?'':(data.id||'');$('formTitle').textContent=(isCopy?'複製':(data.id?'編輯':'新增'))+TITLES[state.mode];$('formFields').innerHTML=formHtml(data);Object.keys(data).forEach(function(k){setVal(k,data[k])});if(!data.id&&!isCopy){if($('f_group'))$('f_group').value='all';if($('f_certainty'))$('f_certainty').value='confirmed';if($('f_category'))$('f_category').value='other';if($('f_status'))$('f_status').value='planned';if($('f_type'))$('f_type').value='train';if($('f_reservation_required'))$('f_reservation_required').value='false'}$('overlay').classList.add('open')}function closeForm(){$('overlay').classList.remove('open')}function collect(){var data={id:$('form').dataset.id||''};$('formFields').querySelectorAll('[id^="f_"]').forEach(function(e){data[e.id.substring(2)]=e.value});return data}
async function submitForm(e){e.preventDefault();$('saveBtn').disabled=true;try{var mode=state.mode,result=await adminApi(SAVE[mode],{payload:collect()});closeForm();if(mode==='places')toast(result.location&&result.location.located?(result.action==='created'?'已新增並完成定位':'已更新並完成定位'):(result.action==='created'?'已新增，但尚未定位':'已更新，但尚未定位'));else toast(result.action==='created'?'已新增':'已更新');await load()}catch(err){handleApiError(err,'儲存')}finally{$('saveBtn').disabled=false}}async function removeItem(id){var row=(state[state.mode]||[]).find(function(r){return r.id===id}),s=summary(row);if(!confirm('確定刪除「'+s[0]+'」？'))return;try{await adminApi(DEL[state.mode],{id:id});toast('已刪除');await load()}catch(err){handleApiError(err,'刪除')}}
$('addBtn').onclick=function(){openForm(null,false)};$('cancelBtn').onclick=closeForm;$('form').onsubmit=submitForm;$('overlay').onclick=function(e){if(e.target===$('overlay'))closeForm()};$('logoutBtn').onclick=logout;verifyAndLoad();})();
</script></body></html>
