<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel Planner">
<title>Travel Planner</title>
<link rel="manifest" href="manifest.webmanifest?v=p15-2-20260905">
<link rel="icon" href="app-icon.svg?v=p12-20260904" type="image/svg+xml">
<link rel="apple-touch-icon" href="app-icon.svg?v=p12-20260904">
<link rel="stylesheet" href="styles.css?v=p15-2-20260905">
<style>
  #startupScreen{display:none;min-height:100dvh;box-sizing:border-box;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));background:#f6f7f9;color:#202124;align-items:center;justify-content:center;text-align:center}
  #startupScreen .startup-card{width:min(360px,100%);padding:28px 20px;border-radius:18px;background:#fff;box-shadow:0 8px 28px rgba(60,64,67,.12)}
  #startupScreen .startup-mark{font-size:34px;line-height:1;margin-bottom:14px}
  #startupScreen strong{display:block;font-size:19px;margin-bottom:7px}
  #startupScreen .startup-meta{font-size:14px;color:#6b7280}
  body.booting #startupScreen{display:flex}
  body.booting .app-shell{visibility:hidden;position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body class="booting">
<div id="startupScreen" role="status" aria-live="polite">
  <div class="startup-card">
    <div class="startup-mark">✈</div>
    <strong>正在開啟旅程…</strong>
    <div class="startup-meta">正在載入最新行程資料</div>
  </div>
</div>
<div class="app-shell">
<header class="topbar">
<div><div class="eyebrow">Travel Planner</div><h1 id="pageTitle">今日</h1></div>
<button id="refreshBtn" class="icon-button" aria-label="重新整理">↻</button>
</header>
<main id="app" class="content"></main>
<nav class="bottom-nav">
<button class="nav-item active" data-view="today"><span>●</span><small>今日</small></button>
<button class="nav-item" data-view="bookings"><span>□</span><small>預訂</small></button>
<button class="nav-item" data-view="more"><span>•••</span><small>更多</small></button>
</nav>
</div>
<script>
(() => {
  const STORAGE_KEY = 'travelPlanner.apiBase.v1';
  const BUILD_VERSION = 'P15.2 · 2026-09-05';
  const app = document.getElementById('app');
  const pageTitle = document.getElementById('pageTitle');
  const refreshBtn = document.getElementById('refreshBtn');
  const nav = document.querySelector('.bottom-nav');

  function finishBoot() {
    requestAnimationFrame(() => {
      document.body.classList.remove('booting');
      const startup = document.getElementById('startupScreen');
      if (startup) startup.remove();
    });
  }

  function normalizeApiUrl(value) {
    const input = String(value || '').trim();
    const url = new URL(input);
    if (url.protocol !== 'https:') throw new Error('資料來源必須使用 HTTPS');
    if (url.hostname !== 'script.google.com') throw new Error('只接受 Google Apps Script Web App URL');
    if (!/^\/macros\/s\/[^/]+\/exec\/?$/.test(url.pathname)) throw new Error('請輸入以 /exec 結尾的 Apps Script Web App URL');
    url.search = '';
    url.hash = '';
    return url.toString().replace(/\/$/, '');
  }

  function jsonpHealth(apiBase, timeoutMs = 20000) {
    return new Promise((resolve, reject) => {
      const callbackName = '__travelPlannerSetup_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const url = new URL(apiBase);
      url.searchParams.set('resource', 'health');
      url.searchParams.set('callback', callbackName);
      url.searchParams.set('_ts', Date.now().toString());
      const timer = setTimeout(() => cleanup(new Error('連線逾時，請確認 Apps Script 已部署並允許存取')), timeoutMs);
      function cleanup(error, data) {
        clearTimeout(timer);
        delete window[callbackName];
        script.remove();
        error ? reject(error) : resolve(data);
      }
      window[callbackName] = data => cleanup(null, data);
      script.src = url.toString();
      script.async = true;
      script.onerror = () => cleanup(new Error('無法載入 API，請檢查 Apps Script 部署權限與 URL'));
      document.head.appendChild(script);
    });
  }

  function appendScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = () => reject(new Error('前端程式載入失敗：' + src));
      document.body.appendChild(script);
    });
  }

  async function loadMainApp(apiBase) {
    window.TRAVEL_PLANNER_CONFIG = {
      apiBase,
      defaultGroup: 'ours',
      defaultDate: null,
      buildVersion: BUILD_VERSION,
      storageKey: STORAGE_KEY
    };
    window.TRAVEL_PLANNER_DEFER_INITIAL_RENDER = true;
    try {
      await appendScript('app.js?v=p15-2-20260905');
      await appendScript('p7network.js?v=p15-2-20260905');
      await appendScript('p15-bootstrap.js?v=p15-2-20260905');
      await appendScript('p4.js?v=p15-2-20260905');
      await appendScript('p7.js?v=p15-2-20260905');
      await appendScript('p7map.js?v=p15-2-20260905');
      await appendScript('p7today.js?v=p15-2-20260905');
      await appendScript('p8.js?v=p15-2-20260905');
      await appendScript('p14-place-memos-traveler.js?v=p15-2-20260905');
      finishBoot();
    } catch (error) {
      console.error(error);
      app.innerHTML = '<div class="card error">前端程式載入失敗，請重新整理頁面。</div>';
      finishBoot();
    }
  }

  function showSetup() {
    document.body.classList.remove('booting');
    const startup = document.getElementById('startupScreen');
    if (startup) startup.remove();
    pageTitle.textContent = '設定資料來源';
    refreshBtn.hidden = true;
    nav.hidden = true;
    app.innerHTML = `<section class="stack"><div class="card"><h2>連接旅程資料</h2><div class="meta">請貼上你的 Google Apps Script Web App URL。網址只會儲存在這台裝置的瀏覽器中，不會寫入 GitHub。</div></div><div class="card"><label for="apiSourceInput"><strong>Apps Script Web App URL</strong></label><input id="apiSourceInput" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%;box-sizing:border-box;margin-top:10px;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px"><button id="connectSourceBtn" class="retry-button" type="button" style="margin-top:12px;width:100%">測試並儲存</button><div id="sourceStatus" class="meta" style="margin-top:10px"></div></div></section>`;
    const input = document.getElementById('apiSourceInput');
    const button = document.getElementById('connectSourceBtn');
    const status = document.getElementById('sourceStatus');
    button.onclick = async () => {
      button.disabled = true;
      status.textContent = '正在測試連線…';
      try {
        const apiBase = normalizeApiUrl(input.value);
        const response = await jsonpHealth(apiBase);
        if (!response || !response.success) throw new Error(response?.error?.message || 'Health check 未通過');
        localStorage.setItem(STORAGE_KEY, apiBase);
        status.textContent = '連線成功，正在開啟旅程…';
        location.reload();
      } catch (error) {
        status.textContent = '連線失敗：' + (error?.message || '未知錯誤');
        button.disabled = false;
      }
    };
  }

  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) { showSetup(); return; }
  try { loadMainApp(normalizeApiUrl(saved)); }
  catch (error) { localStorage.removeItem(STORAGE_KEY); showSetup(); }
})();
</script>
</body>
</html>
