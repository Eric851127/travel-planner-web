<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travel Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div><div class="eyebrow">Travel Planner</div><h1 id="pageTitle">Today</h1></div>
<button id="refreshBtn" class="icon-button" aria-label="重新整理">↻</button>
</header>
<main id="app" class="content"></main>
<nav class="bottom-nav">
<button class="nav-item active" data-view="today"><span>●</span><small>Today</small></button>
<button class="nav-item" data-view="trip"><span>≡</span><small>Trip</small></button>
<button class="nav-item" data-view="bookings"><span>□</span><small>Bookings</small></button>
<button class="nav-item" data-view="map"><span>⌖</span><small>Map</small></button>
<button class="nav-item" data-view="more"><span>•••</span><small>More</small></button>
</nav>
</div>
<script>
window.TRAVEL_PLANNER_CONFIG = {
  apiBase: "https://script.google.com/macros/s/AKfycbwAKt2KkcLKAQye2icfGYaCTEhranJTi-dS8Kr4zad9sK_vmh-tBaG91wgQbDmF82hR/exec",
  defaultGroup: "all",
  defaultDate: "2026-12-24"
};
</script>
<script src="app.js"></script>
</body>
</html>
