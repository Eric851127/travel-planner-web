<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>Travel Planner Admin</title>
</head>
<body>
<p>正在開啟 Travel Planner Admin… <a href="admin-p11.html">點此進入</a></p>
<script>
(function(){
  var endpointKey='travelPlanner.p9AuthEndpoint.v1';
  var sessionKey='travelPlanner.p9Session.v1';
  var productionEndpoint='https://script.google.com/macros/s/AKfycbzpBT-CqGtHiFtY9mb_p_diNNs46GC4h7ks-gKCMKHG-bSE6xWE_Q5Vc0eAkET4kpsS/exec';
  try{
    var hasSession=!!String(localStorage.getItem(sessionKey)||'').trim();
    var hasEndpoint=!!String(localStorage.getItem(endpointKey)||'').trim();
    if(hasSession&&!hasEndpoint)localStorage.setItem(endpointKey,productionEndpoint);
  }catch(_){}

  var marker='<div class="top-actions"><button class="btn secondary" id="logoutBtn" hidden>登出</button>';
  var replacement='<div class="top-actions"><button class="btn secondary" id="travelerBtn" type="button" hidden onclick="location.href=\'./\'">查看旅程</button><button class="btn secondary" id="logoutBtn" hidden>登出</button>';
  var showAuthMarker="$('adminPanel').hidden=true;$('addBtn').hidden=true;$('logoutBtn').hidden=!token();";
  var showAuthReplacement="$('adminPanel').hidden=true;$('addBtn').hidden=true;$('travelerBtn').hidden=true;$('logoutBtn').hidden=!token();";
  var loadMarker="$('authPanel').innerHTML='';$('adminPanel').hidden=false;$('addBtn').hidden=false;$('logoutBtn').hidden=false;";
  var loadReplacement="$('authPanel').innerHTML='';$('adminPanel').hidden=false;$('addBtn').hidden=false;$('travelerBtn').hidden=false;$('logoutBtn').hidden=false;";

  fetch('admin-p11.html',{cache:'no-store'})
    .then(function(response){if(!response.ok)throw new Error('ADMIN_LOAD_FAILED');return response.text();})
    .then(function(html){
      if(html.indexOf(marker)<0||html.indexOf(showAuthMarker)<0||html.indexOf(loadMarker)<0)throw new Error('ADMIN_PATCH_MARKER_NOT_FOUND');
      html=html.replace(marker,replacement).replace(showAuthMarker,showAuthReplacement).replace(loadMarker,loadReplacement);
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(){location.replace('admin-p11.html');});
})();
</script>
</body>
</html>
